<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System One Playground UI</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="./icons/icon-128.png" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="workspace">
    <main class="page">
      <header class="header">
        <h1>System One Playground UI</h1>
        <p class="lede">Send one decide request and read the typed answers.</p>
      </header>

      <div class="tablist" role="tablist" aria-label="Playground">
        <button
          type="button"
          class="tab"
          role="tab"
          id="tab-request"
          aria-selected="true"
          aria-controls="panel-request"
        >
          Request
        </button>
        <button
          type="button"
          class="tab"
          role="tab"
          id="tab-schema"
          aria-selected="false"
          aria-controls="panel-schema"
          tabindex="-1"
        >
          Context Schema
        </button>
      </div>

      <form id="decide-form" class="form" novalidate>
        <div
          id="panel-request"
          role="tabpanel"
          aria-labelledby="tab-request"
          class="tabpanel"
        >
          <div class="field">
            <label for="base-url">Base URL</label>
            <input
              id="base-url"
              name="base-url"
              type="url"
              autocomplete="off"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="model">Model</label>
            <input id="model" name="model" type="text" autocomplete="off" />
          </div>

          <div class="field">
            <label for="keep-alive">Keep alive</label>
            <input
              id="keep-alive"
              name="keep-alive"
              type="text"
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="state">User Message</label>
            <textarea id="state" name="state" rows="4"></textarea>
          </div>
        </div>

        <div
          id="panel-schema"
          role="tabpanel"
          aria-labelledby="tab-schema"
          class="tabpanel"
          hidden
        >
          <fieldset class="schema">
            <legend class="visually-hidden">Context Schema</legend>
            <div id="schema-list"></div>
            <div class="schema-add">
              <select id="schema-type" aria-label="Type">
                <option value="choice">choice</option>
                <option value="score">score</option>
                <option value="noul">noul</option>
              </select>
              <button id="schema-add" class="quiet" type="button">
                Add schema
              </button>
            </div>
            <p id="schema-error" class="field-error" hidden></p>
          </fieldset>
        </div>

        <button id="submit" type="submit">Send</button>
      </form>
    </main>

    <section class="answer-dock" aria-label="Response">
      <div class="answer-dock-inner">
        <div class="column-tools">
          <button
            type="button"
            id="history-toggle"
            class="quiet icon-button"
            aria-label="History"
            aria-pressed="false"
            aria-controls="history-panel"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle
                cx="8"
                cy="8"
                r="5.25"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              ></circle>
              <path
                d="M8 4.75 V8.25 L10.75 9.75"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              ></path>
            </svg>
          </button>
        </div>
        <section id="history-panel" class="history-panel" hidden>
          <div class="history-bar">
            <h2>History</h2>
            <button type="button" id="history-current" class="quiet">
              Current response
            </button>
          </div>
          <div id="history-list"></div>
          <div id="history-detail" hidden></div>
        </section>
        <div id="live-panel">
        <section class="request-preview">
          <h2 id="request-preview-label">API request</h2>
          <textarea
            id="request-preview"
            readonly
            spellcheck="false"
            aria-labelledby="request-preview-label"
          ></textarea>
        </section>
        <div class="answer-dock-bar">
          <h2>Response</h2>
          <button
            type="button"
            id="raw-toggle"
            class="quiet"
            hidden
            aria-pressed="false"
          >
            Raw JSON
          </button>
        </div>
        <div
          id="response"
          class="response empty"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        </div>
      </div>
    </section>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
